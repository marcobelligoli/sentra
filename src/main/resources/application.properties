spring.application.name=sentra

# Many hosting services choose the port through the PORT variable
server.port=${PORT:8080}
# Behind the HTTPS proxy of the hosting service: trust its X-Forwarded-* headers
server.forward-headers-strategy=native
# All the endpoints are under /sentra, e.g. /sentra/api/me/fans and /sentra/actuator/health
server.servlet.context-path=/sentra

# Only the health endpoint is exposed, publicly and without details (status UP or DOWN, database included)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Liveness/readiness groups are for Kubernetes, not needed on the hosting service
management.endpoint.health.probes.enabled=false

spring.datasource.url=${SENTRA_DB_URL:jdbc:postgresql://localhost:5432/sentra}
spring.datasource.username=${SENTRA_DB_USERNAME:sentra}
spring.datasource.password=${SENTRA_DB_PASSWORD:sentra}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Daily sync (default 18:00 Italian time, whatever the time zone of the server)
sentra.sync.cron=${SENTRA_SYNC_CRON:0 0 18 * * *}
sentra.sync.zone=${SENTRA_SYNC_ZONE:Europe/Rome}
# Random pause between Instagram requests and between accounts
sentra.sync.min-delay=2s
sentra.sync.max-delay=6s
# A fetch returning less than this share of the profile counters is considered incomplete and discarded
sentra.sync.min-completeness=0.95
# Minimum time between the last sync of an account (manual or scheduled, even if failed) and a manual sync of it
sentra.sync.min-manual-interval=1h

# History of changes: events older than this are deleted by a job running on this schedule (time zone of sentra.sync.zone)
sentra.retention.event-max-age=${SENTRA_EVENT_MAX_AGE:30d}
sentra.retention.cron=${SENTRA_RETENTION_CRON:0 30 3 * * *}

# Leave the token empty to log notifications instead of sending them
sentra.telegram.bot-token=${SENTRA_TELEGRAM_BOT_TOKEN:}
sentra.telegram.chat-id=${SENTRA_TELEGRAM_CHAT_ID:}

# Monitored accounts are bound from environment variables, three per account (index 0, 1, ...):
#   SENTRA_ACCOUNTS_0_USERNAME           Instagram username, also the API username
#   SENTRA_ACCOUNTS_0_INSTAGRAM_PASSWORD used only to log in to Instagram
#   SENTRA_ACCOUNTS_0_API_PASSWORD       Basic Auth password of the API, at least 16 characters: openssl rand -base64 24

# After this many failed API logins within the lockout window, the client address is blocked for the lockout duration
sentra.security.max-failed-logins=5
sentra.security.lockout=15m

# Key encrypting the Instagram session stored in the database (Base64, 32 bytes): openssl rand -base64 32
sentra.session-key=${SENTRA_SESSION_KEY:}
