spring.application.name=sentra

# Many hosting services choose the port through the PORT variable
server.port=${PORT:8080}
# Behind the HTTPS proxy of the hosting service: trust its X-Forwarded-* headers
server.forward-headers-strategy=native

spring.datasource.url=${SENTRA_DB_URL:jdbc:postgresql://localhost:5432/sentra}
spring.datasource.username=${SENTRA_DB_USERNAME:sentra}
spring.datasource.password=${SENTRA_DB_PASSWORD:sentra}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Daily sync (default 18:00 Italian time, whatever the time zone of the server)
sentra.sync.cron=${SENTRA_SYNC_CRON:0 0 18 * * *}
sentra.sync.zone=${SENTRA_SYNC_ZONE:Europe/Rome}
# Random pause between Instagram requests and between accounts
sentra.sync.min-delay=2s
sentra.sync.max-delay=6s
# A fetch returning less than this share of the profile counters is considered incomplete and discarded
sentra.sync.min-completeness=0.95

# Leave the token empty to log notifications instead of sending them
sentra.telegram.bot-token=${SENTRA_TELEGRAM_BOT_TOKEN:}
sentra.telegram.chat-id=${SENTRA_TELEGRAM_CHAT_ID:}

# Monitored accounts are bound from environment variables, one pair per account:
#   SENTRA_ACCOUNTS_0_USERNAME / SENTRA_ACCOUNTS_0_PASSWORD
#   SENTRA_ACCOUNTS_1_USERNAME / SENTRA_ACCOUNTS_1_PASSWORD
# The same credentials are the Basic Auth credentials of the REST API.

# Key encrypting the Instagram session stored in the database (Base64, 32 bytes): openssl rand -base64 32
sentra.session-key=${SENTRA_SESSION_KEY:}
