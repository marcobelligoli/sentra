services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentra
      POSTGRES_USER: sentra
      POSTGRES_PASSWORD: sentra
    ports:
      # Reachable only from this machine
      - "127.0.0.1:5432:5432"
    volumes:
      - sentra-data:/var/lib/postgresql/data

volumes:
  sentra-data:
